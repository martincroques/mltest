# Fortigate - VPN IPSec route-based para Palo Alto (exemplo conceitual)
# Substituir ${PSK} por um segredo vindo de cofre. NÃO versionar o PSK.

config firewall address
    edit "LAN-FG-192.168.10.0_24"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "LAN-PA-192.168.20.0_24"
        set subnet 192.168.20.0 255.255.255.0
    next
end

config vpn ipsec phase1-interface
    edit "VPN-TO-PA"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 14
        set remote-gw 198.51.100.1
        set psksecret ${PSK}
        set keylife 28800
        set dpd on-idle
        set dpd-retryinterval 10
        set nattraversal disable
    next
end

config vpn ipsec phase2-interface
    edit "VPN-TO-PA-P2"
        set phase1name "VPN-TO-PA"
        set proposal aes256-sha256
        set pfs enable
        set dhgrp 14
        set keylifeseconds 3600
        set src-addr-type subnet
        set dst-addr-type subnet
        set src-subnet 192.168.10.0 255.255.255.0
        set dst-subnet 192.168.20.0 255.255.255.0
    next
end

# Interface de túnel: 169.255.1.1 <-> 169.255.1.2 (/30)
config system interface
    edit "VPN-TO-PA"
        set ip 169.255.1.1 255.255.255.255
        set remote-ip 169.255.1.2 255.255.255.252
        set allowaccess ping
        set tcp-mss 1350
    next
end

config router static
    edit 100
        set dst 192.168.20.0 255.255.255.0
        set device "VPN-TO-PA"
    next
end

config firewall policy
    edit 100
        set name "LAN-FG-to-LAN-PA"
        set srcintf "port2"
        set dstintf "VPN-TO-PA"
        set srcaddr "LAN-FG-192.168.10.0_24"
        set dstaddr "LAN-PA-192.168.20.0_24"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 101
        set name "LAN-PA-to-LAN-FG"
        set srcintf "VPN-TO-PA"
        set dstintf "port2"
        set srcaddr "LAN-PA-192.168.20.0_24"
        set dstaddr "LAN-FG-192.168.10.0_24"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
